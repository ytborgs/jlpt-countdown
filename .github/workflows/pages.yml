name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate study-data
        run: node scripts/validate-study-data.mjs
      - name: Syntax-check study modules
        run: |
          node --check study.js
          node --check study-storage.js
          node --check study-session.js
          node --check study-render.js
          node --check study-flash.js
          node --check grammar.js
          node --check sw.js
          node --check register-sw.js
      - name: Storage merge smoke test
        run: node scripts/test-storage-merge.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
