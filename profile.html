<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11223a">
  <title>Chỉnh sửa tên · JLPT N3</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./settings.css">
  <script src="./settings.js" defer></script>
</head>
<body class="profile-page"><main>
  <a class="back" href="./settings.html">← Cài đặt</a>
  <h1>Chỉnh sửa tên</h1><p class="intro">Tên của bạn sẽ hiện trong lời chào trên trang countdown.</p>
  <form id="profile-form">
    <label for="username">Tên của bạn</label>
    <input id="username" name="username" type="text" maxlength="40" autocomplete="nickname" placeholder="Nhập tên của bạn" aria-describedby="name-hint">
    <p class="hint" id="name-hint">Tên chỉ lưu trên thiết bị này. Để trống nếu muốn xóa tên.</p>
    <p class="error" id="profile-error" role="alert" hidden></p>
    <button type="submit">Lưu tên</button>
  </form>
</main></body>
</html>
