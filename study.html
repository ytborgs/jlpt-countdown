<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11223a">
  <title>Tài liệu ôn tập N3 tổng hợp</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./grammar.css">
  <link rel="stylesheet" href="./study.css?v=25">
  <script type="module" src="./study.js?v=25"></script>
</head>
<body class="grammar-library-page study-page"><main>
  <header class="library-toolbar">
    <div class="library-toolbar-row"><a id="study-back" href="./settings.html" class="back" aria-label="Về Cài đặt">←</a><h1 id="study-title">Tài liệu ôn tập N3 tổng hợp</h1></div>
    <label class="grammar-search-label" for="study-search">Tìm trong tài liệu</label>
    <input class="grammar-search" id="study-search" type="search" placeholder="Tìm tài liệu…" autocomplete="off">
    <p class="grammar-status" id="study-status" role="status">Đang tải tài liệu…</p>
  </header>
  <p id="study-notice" class="study-notice" hidden></p>
  <section id="study-progress" class="study-progress" aria-label="Tiến độ luyện tập" hidden>
    <p id="study-progress-text" class="study-progress-text" aria-live="polite"></p>
    <div id="study-progress-bar" class="study-progress-bar" role="progressbar" aria-label="Tiến độ hoàn thành" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="study-progress-ok" class="study-progress-fill study-progress-ok"></span>
      <span id="study-progress-bad" class="study-progress-fill study-progress-bad"></span>
    </div>
    <div id="study-progress-filters" class="study-progress-filters" role="group" aria-label="Lọc câu hỏi"></div>
    <div class="study-progress-actions">
      <button type="button" id="study-retry-wrong">Làm lại câu sai</button>
      <button type="button" id="study-reset-topic">Xóa tiến độ bộ này</button>
    </div>
  </section>
  <button id="study-retry" class="grammar-retry" type="button" hidden>Thử tải lại</button>
  <div id="study-list" class="grammar-list" aria-busy="true"></div>
  <noscript>Bật JavaScript để xem tài liệu ôn tập.</noscript>
</main></body>
</html>
