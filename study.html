<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11223a">
  <title>Tài liệu ôn tập N3 tổng hợp</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./grammar.css">
  <link rel="stylesheet" href="./study.css?v=45">
  <script>
    window.__STUDY_BOOT__ = {
      release: '45',
      ready: false,
      phase: 'html',
      startedAt: Date.now(),
    };
  </script>
  <script type="module">
    const boot = window.__STUDY_BOOT__;
    const statusEl = () => document.getElementById('study-status');
    const fallback = () => document.getElementById('study-boot-fallback');
    const detail = () => document.getElementById('study-boot-detail');

    const showRecovery = (reason, error) => {
      if (boot.ready) return;
      boot.phase = 'recovery:' + reason;
      const box = fallback();
      if (box) box.hidden = false;
      const status = statusEl();
      if (status) status.textContent = 'Không tải được trang ôn tập. Hãy thử lại hoặc tải bản mới.';
      if (detail()) {
        detail().textContent = [
          'release=' + boot.release,
          'phase=' + reason,
          error && error.message ? 'error=' + error.message : '',
        ].filter(Boolean).join(' · ');
      }
      console.error('[study-boot]', {
        release: boot.release,
        phase: reason,
        message: error && error.message,
        name: error && error.name,
      });
    };

    window.addEventListener('study-boot-error', event => {
      showRecovery(event.detail?.phase || 'event', event.detail?.error);
    });

    const BOOT_TIMEOUT_MS = 15000;
    const timer = setTimeout(() => {
      if (!boot.ready) showRecovery('timeout');
    }, BOOT_TIMEOUT_MS);

    import('./study.js?v=45')
      .then(() => { boot.phase = 'module-loaded'; })
      .catch(error => {
        clearTimeout(timer);
        showRecovery('import', error);
      });

    const clearWhenReady = setInterval(() => {
      if (boot.ready) {
        clearTimeout(timer);
        clearInterval(clearWhenReady);
        const box = fallback();
        if (box) box.hidden = true;
      }
    }, 250);
  </script>
  <script src="./register-sw.js" defer></script>
</head>
<body class="grammar-library-page study-page"><main>
  <header class="library-toolbar">
    <div class="library-toolbar-row"><a id="study-back" href="./settings.html" class="back" aria-label="Về Cài đặt">←</a><h1 id="study-title">Tài liệu ôn tập N3 tổng hợp</h1></div>
    <label class="grammar-search-label" for="study-search">Tìm trong tài liệu</label>
    <input class="grammar-search" id="study-search" type="search" placeholder="Tìm tài liệu…" autocomplete="off">
    <nav id="study-group-filters" class="study-group-filters" aria-label="Lọc theo nhóm tài liệu" hidden></nav>
    <p class="grammar-status" id="study-status" role="status">Đang tải tài liệu…</p>
    <div id="study-boot-fallback" class="study-boot-fallback" hidden>
      <p id="study-boot-detail" class="study-boot-detail"></p>
      <div class="study-boot-actions">
        <button type="button" id="study-boot-retry">Thử lại</button>
        <button type="button" id="study-boot-fresh">Tải bản mới</button>
      </div>
    </div>
  <section id="study-progress" class="study-progress study-practice-progress" aria-label="Tiến độ luyện tập" hidden>
    <div class="study-practice-strip">
      <nav id="study-view-mode" class="study-view-mode" aria-label="Chế độ xem" hidden></nav>
      <div class="study-practice-meta">
        <p id="study-progress-text" class="study-progress-text" aria-live="polite"></p>
        <div id="study-progress-bar" class="study-progress-bar" role="progressbar" aria-label="Tiến độ hoàn thành" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="study-progress-ok" class="study-progress-fill study-progress-ok"></span>
          <span id="study-progress-bad" class="study-progress-fill study-progress-bad"></span>
        </div>
      </div>
      <details id="study-filter-drawer" class="study-filter-drawer">
        <summary id="study-filter-summary">Lọc</summary>
        <div id="study-progress-filters" class="study-progress-filters" role="group" aria-label="Lọc câu hỏi"></div>
      </details>
      <details id="study-progress-menu" class="study-progress-menu">
        <summary aria-label="Thao tác tiến độ" title="Thao tác tiến độ">⋯</summary>
        <div class="study-progress-actions">
          <button type="button" id="study-session-20">20 câu chưa làm</button>
          <button type="button" id="study-retry-wrong">Làm lại câu sai</button>
          <button type="button" id="study-reset-topic">Xóa tiến độ bộ này</button>
        </div>
      </details>
    </div>
  </section>
  <section id="study-known-progress" class="study-progress study-known-progress" aria-label="Tiến độ ghi nhớ" hidden>
    <div class="study-known-strip">
      <div class="study-known-meta">
        <p id="study-known-text" class="study-progress-text" aria-live="polite"></p>
        <div id="study-known-bar" class="study-progress-bar" role="progressbar" aria-label="Tiến độ đã thuộc" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="study-known-fill" class="study-progress-fill study-progress-ok"></span>
        </div>
      </div>
      <div id="study-known-filters" class="study-progress-filters" role="group" aria-label="Lọc mức độ ghi nhớ"></div>
    </div>
  </section>
  </header>
  <p id="study-notice" class="study-notice" hidden></p>
  <button id="study-retry" class="grammar-retry" type="button" hidden>Thử tải lại</button>
  <div id="study-list" class="grammar-list" aria-busy="true"></div>
  <section id="study-flash" class="study-flash" hidden aria-label="Ôn nhanh">
    <div class="study-flash-bar">
      <p id="study-flash-counter" class="study-flash-counter" aria-live="polite"></p>
      <label class="study-flash-shuffle"><input type="checkbox" id="study-flash-shuffle"> Xáo trộn</label>
      <button type="button" id="study-flash-exit" class="study-flash-exit">Thoát</button>
    </div>
    <article id="study-flash-card" class="study-flash-card" tabindex="0">
      <div id="study-flash-head" class="study-flash-head"></div>
      <div id="study-flash-answer" class="study-flash-answer" hidden>
        <div id="study-flash-meaning" class="study-flash-meaning"></div>
        <div id="study-flash-example" class="study-flash-example"></div>
      </div>
      <div id="study-flash-front-actions" class="study-flash-actions">
        <button type="button" id="study-flash-reveal">Hiện đáp án</button>
      </div>
      <div id="study-flash-back-actions" class="study-flash-actions study-flash-back-actions" hidden>
        <button type="button" id="study-flash-mark-known">Đã thuộc</button>
        <button type="button" id="study-flash-mark-unknown">Chưa thuộc</button>
        <button type="button" id="study-flash-next" class="study-flash-next">Tiếp →</button>
      </div>
    </article>
    <div id="study-flash-done" class="study-flash-done" hidden>
      <h2 id="study-flash-done-title">Đã ôn hết</h2>
      <p id="study-flash-done-text"></p>
      <div class="study-flash-done-actions">
        <button type="button" id="study-flash-retry-unknown">Ôn lại chưa thuộc</button>
        <button type="button" id="study-flash-retry-all">Ôn tất cả</button>
        <button type="button" id="study-flash-back-list" class="study-flash-secondary">Về danh sách</button>
      </div>
    </div>
  </section>
  <noscript>Bật JavaScript để xem tài liệu ôn tập.</noscript>
</main>
<section id="study-session-nav" class="study-session-dock" aria-label="Điều hướng phiên luyện" hidden>
  <p id="study-session-text" class="study-session-text" aria-live="polite"></p>
  <div class="study-session-actions">
    <button type="button" id="study-session-prev">Trước</button>
    <button type="button" id="study-session-skip">Bỏ qua</button>
    <button type="button" id="study-session-next" class="study-session-next">Tiếp</button>
  </div>
</section>
<div id="study-flash-fab" class="study-flash-fab" hidden>
  <div id="study-flash-fab-menu" class="study-flash-fab-menu" role="menu" hidden>
    <button type="button" id="study-flash-fab-unknown" role="menuitem">Ôn chưa thuộc</button>
    <button type="button" id="study-flash-fab-all" role="menuitem">Ôn tất cả</button>
  </div>
  <button type="button" id="study-flash-start" class="study-flash-fab-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="study-flash-fab-menu">
    Ôn nhanh
  </button>
</div>
<dialog id="study-explanation-dialog" class="study-modal" aria-labelledby="study-explanation-title">
  <div class="study-modal-panel">
    <header class="study-modal-header">
      <h2 id="study-explanation-title">Giải thích đáp án</h2>
      <button type="button" id="study-explanation-close" class="study-modal-close" aria-label="Đóng giải thích" autofocus>Đóng ✕</button>
    </header>
    <div id="study-explanation-content" class="study-explain study-modal-content"></div>
  </div>
</dialog>
<script>
  (() => {
    const retry = document.getElementById('study-boot-retry');
    const fresh = document.getElementById('study-boot-fresh');
    if (retry) retry.addEventListener('click', () => location.reload());
    if (fresh) fresh.addEventListener('click', () => {
      const url = new URL(location.href);
      url.searchParams.set('_r', String(Date.now()));
      location.replace(url.pathname + url.search + url.hash);
    });
  })();
</script>
</body>
</html>
