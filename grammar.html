<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11223a">
  <title>Tất cả ngữ pháp N3 · JLPT</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./grammar.css">
  <style>
    :root{color-scheme:dark;--bg:#0b1729;--card:#13243c;--line:#304662;--text:#f5f2e9;--muted:#a9b6c8;--accent:#eabb76;--green:#a8d6ba}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f0e6;--card:#fffbf4;--line:#d9d6cb;--text:#18283b;--muted:#617084;--accent:#a2611e;--green:#44745c}}
  </style>
  <script type="module" src="./grammar.js"></script>
</head>
<body class="grammar-library-page"><main id="library-grammar">
  <header class="library-toolbar">
    <div class="library-toolbar-row"><a href="./settings.html" class="back" aria-label="Về Cài đặt" title="Về Cài đặt">←</a><h1>Tất cả ngữ pháp N3</h1></div>
    <label class="grammar-search-label" for="grammar-search">Tìm mẫu ngữ pháp hoặc ý nghĩa</label>
    <input class="grammar-search" id="grammar-search" type="search" placeholder="Tìm mẫu ngữ pháp hoặc ý nghĩa…" autocomplete="off">
    <p class="grammar-status" id="grammar-status" role="status">Đang tải ngữ pháp…</p>
  </header>
  <button class="grammar-retry" id="grammar-retry" type="button" hidden>Thử tải lại</button>
  <div class="grammar-list" id="grammar-list" aria-busy="true"></div>
  <noscript>Bật JavaScript để xem danh sách ngữ pháp.</noscript>
</main></body>
</html>
